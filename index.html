<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canabis Hub – Premium German Cannabis Platform & Directory</title>
    <meta name="description" content="Explore certified cannabis brands, artisanal flower farms, laboratory purity standards, and educational resources across Germany." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Canabis Hub – Premium German Cannabis Platform & Directory" />
    <meta property="og:description" content="Explore certified cannabis brands, artisanal flower farms, laboratory purity standards, and educational resources across Germany." />
    <meta property="og:site_name" content="Canabis Hub" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Canabis Hub – Premium German Cannabis Platform & Directory" />
    <meta name="twitter:description" content="Explore certified cannabis brands, artisanal flower farms, laboratory purity standards, and educational resources across Germany." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Canabis Hub",
      "url": "https://canabishub.de",
      "description": "Premium German cannabis industry information directory, brand showcase, and verified educational resources.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://canabishub.de/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-[#FFFDF8] text-[#263A36] antialiased selection:bg-[#F28A19]/20 selection:text-[#073B2E]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
